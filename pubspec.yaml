name: cliks
description: "Cliks Enterprise & Financial SaaS Mobile App."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  google_fonts: ^6.1.0
  lucide_icons_flutter: ^3.1.14+2
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  responsive_framework: ^1.1.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/cliks_logo.png"
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/cliks_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#f7f9fb"
  image: "assets/cliks_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/cliks_logo.png
    - assets/images/
    - assets/bit_tool_logo.png
